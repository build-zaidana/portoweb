# Netlify: static Astro build (PRD §10: host = Netlify, forms = Netlify Forms).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Deploy previews (pull requests) show the sample content so layouts can be reviewed.
# Production never does (PRD F3): SHOW_SAMPLES is unset there.
[context.deploy-preview.environment]
  SHOW_SAMPLES = "true"

# Hashed build assets (JS, CSS, fonts) never change under the same name.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
